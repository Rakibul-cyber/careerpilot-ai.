name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careerpilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      DEBUG: "false"
      SECRET_KEY: test-secret-for-ci-only
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/careerpilot_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Lint backend
        run: ruff check backend/app backend/tests

      - name: Check backend formatting
        run: ruff format --check backend/app backend/tests

      - name: Compile backend
        run: python -m compileall backend/app backend/tests

      - name: Run backend unit tests with coverage
        run: coverage run -m unittest discover backend/tests

      - name: Report backend coverage
        run: coverage report

      - name: Run database migrations
        run: alembic -c backend/alembic.ini upgrade head

      - name: Check migration state
        run: alembic -c backend/alembic.ini check
