# CareerPilot AI — local development stack.
# Brings up the FastAPI backend alongside a PostgreSQL database.
# For production, prefer managed infra (e.g. AWS RDS/ECS) defined under infra/.

services:
  api:
    build: .
    container_name: careerpilot_api
    env_file:
      - .env
    environment:
      # Inside Docker, Postgres is reachable at the Compose service name "db".
      DATABASE_URL: >-
        ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@db:5432/careerpilot}
    ports:
      - "8000:8000"
    depends_on:
      - db
    # Live-reload mount for development.
    volumes:
      - .:/app

  db:
    # pgvector/pgvector:pg16 is the official Postgres 16 image bundled with the
    # pgvector extension (needed for semantic search, M31). Same data format as
    # postgres:16, so the postgres_data volume carries over unchanged.
    image: pgvector/pgvector:pg16
    container_name: careerpilot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
