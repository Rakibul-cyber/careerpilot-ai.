# CareerPilot AI production-style Docker profile.
# Keep this focused: API + PostgreSQL only, no source mounts, no reload.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: careerpilot-api:prod
    container_name: careerpilot_api_prod
    environment:
      APP_NAME: ${APP_NAME:-CareerPilot AI}
      ENVIRONMENT: production
      DEBUG: "false"
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: >-
        ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/careerpilot}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a strong production secret}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Europe/Berlin}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      MAX_RESUME_UPLOAD_MB: ${MAX_RESUME_UPLOAD_MB:-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      AI_PARSER_MAX_TOKENS: ${AI_PARSER_MAX_TOKENS:-4096}
      AI_COVER_LETTER_MAX_TOKENS: ${AI_COVER_LETTER_MAX_TOKENS:-2048}
      AI_INTERVIEW_PREPARATION_MAX_TOKENS: >-
        ${AI_INTERVIEW_PREPARATION_MAX_TOKENS:-4096}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: careerpilot_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_prod_data:
